<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of elements</title>
</head>
<body>
    <!-- Block Elements: -->
     <div>Hello</div>
     <div>World</div>

     <header>Welcome to </header>
     <HEADER>Html</HEADER>

     <h1>Hello </h1>
     <h2>World</h2>

     <!-- Inline Elements: -->
      <center>
      <a href="http://www.google.com">Google link </a>
      </center> 
<ul>
    <li>Naruto</li>
    <hr>
    <li>Bleach</li>
    <li>One Piece</li>
</ul>

      <span>Hello</span>
      <br>
<p>Hello, this is a paragraph.</p>
<b>Konichiwa</b>
<br>
<i>Watashiwa</i>
<img src="./dark-batman-4k-31-2880x1800.jpg" alt="error in loading">

</body>
</html>
